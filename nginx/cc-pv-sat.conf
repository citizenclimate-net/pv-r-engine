# Satellite pillars (4-5) service, included inside the cc-pv-r server block(s):
#   include /etc/nginx/snippets/cc-pv-sat.conf;
# /sat/run -> 127.0.0.1:8002/run. A Sentinel-2 run reads a few hundred COG
# windows, so allow up to 30 minutes.
location /sat/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-API-Key $http_x_api_key;
}
